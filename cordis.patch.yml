# 三省六部工作台 · 宿主包补丁层
#
# 一行 insert 把宿主入口（index.js）挂进应用：账本、HTTP 接口、会话
# 装配与三层记忆都在 workbench/host 里。0.11.0–0.12.1 期间本文件是
# 空层（[]），以为 bundle 加载会自动带起宿主入口——实际不会：没有
# insert 行，宿主插件根本不被应用，从商店单独安装时工作台后端不
# 启动（接口 404）。0.12.2 起补上这一行，与其它插件包同一装法。
# 老预设线（上朝模式/朝堂侧栏）仍保持退役，本层不恢复任何预设。
- insert:
    - id: dsh-sansheng-liubu-mode
      name: 'dsh-sansheng-liubu-mode'
      config: {}
